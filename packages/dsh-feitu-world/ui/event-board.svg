<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#090f15"/><text x="58" y="70" fill="#f7f2e8" font-family="sans-serif" font-size="32" font-weight="700">INTERACTIVE EVENT BOARD</text><text x="58" y="105" fill="#8ca3b5" font-family="sans-serif" font-size="15">结果标签来自冻结事件结果表；玩家只能选择当前节点和角色可见的结果</text>
  <g font-family="sans-serif"><g transform="translate(58 150)"><rect width="330" height="470" rx="16" fill="#142738" stroke="#68d5c2"/><text x="28" y="52" fill="#68d5c2" font-size="16">IE_ZN_TRACK_CONFRONTATION</text><text x="28" y="94" fill="#f7f2e8" font-size="22">祝宁 · 轨道行动</text><line x1="28" y1="122" x2="302" y2="122" stroke="#355566"/><text x="28" y="165" fill="#bde5df" font-size="16">成功</text><text x="28" y="193" fill="#d8e4e8" font-size="14">制造脱离窗口</text><text x="28" y="250" fill="#f2b66d" font-size="16">部分成功</text><text x="28" y="278" fill="#d8e4e8" font-size="14">带伤脱离，保留救治窗</text><text x="28" y="335" fill="#e68c83" font-size="16">失败</text><text x="28" y="363" fill="#d8e4e8" font-size="14">伤势加重，终局仍可选择</text></g><g transform="translate(435 150)"><rect width="330" height="470" rx="16" fill="#2b2026" stroke="#f2b66d"/><text x="28" y="52" fill="#f2b66d" font-size="16">IE_LN_DRIVER_CAB</text><text x="28" y="94" fill="#f7f2e8" font-size="22">李念川 · 司机室</text><line x1="28" y1="122" x2="302" y2="122" stroke="#634d42"/><text x="28" y="165" fill="#f3c98e" font-size="16">成功</text><text x="28" y="193" fill="#e9d9c7" font-size="14">稳住司机室，延长窗口</text><text x="28" y="250" fill="#f2b66d" font-size="16">部分成功</text><text x="28" y="278" fill="#e9d9c7" font-size="14">进入司机室但受阻</text><text x="28" y="335" fill="#e68c83" font-size="16">失败</text><text x="28" y="363" fill="#e9d9c7" font-size="14">司机室干预失败</text></g><g transform="translate(812 150)"><rect width="330" height="470" rx="16" fill="#241f39" stroke="#b9a1ff"/><text x="28" y="52" fill="#b9a1ff" font-size="16">IE_PRE_EXPANSION_ESCAPE</text><text x="28" y="94" fill="#f7f2e8" font-size="22">小队 · 撤离窗口</text><line x1="28" y1="122" x2="302" y2="122" stroke="#5e527e"/><text x="28" y="165" fill="#d4c7ff" font-size="16">成功</text><text x="28" y="193" fill="#e0dafa" font-size="14">沿已知路线撤离 · END_04</text><text x="28" y="250" fill="#f2b66d" font-size="16">部分成功</text><text x="28" y="278" fill="#e0dafa" font-size="14">撤离被拖慢，场域展开</text><text x="28" y="335" fill="#e68c83" font-size="16">失败</text><text x="28" y="363" fill="#e0dafa" font-size="14">停在场域边界</text></g></g>
