<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#071018"/><text x="60" y="72" fill="#f7f2e8" font-family="sans-serif" font-size="34" font-weight="700">PLAYER ROLE CARDS</text><text x="60" y="108" fill="#8ca3b5" font-family="sans-serif" font-size="16">冻结角色 · 能力白名单 · 知识边界</text>
