    <text x="402" y="222" fill="#72e5ff" font-size="12">L001 · 20:00 · 夜间</text>
    <text x="402" y="264" fill="#e5f4f8" font-size="23" font-weight="700">A7号下水道地面入口/警戒区</text>
    <text x="402" y="325" fill="#d2e5ee" font-size="16">两盏大灯把荒地照得如同白昼。警戒线外，</text><text x="402" y="352" fill="#d2e5ee" font-size="16">任务车辆和工作人员正在等待下井。</text>
    <rect x="402" y="402" width="584" height="80" rx="8" fill="#2b1c23" stroke="#d76565"/><text x="422" y="435" fill="#edc4c4" font-size="14">系统提示：入口下方存在孢子溢出风险；</text><text x="422" y="461" fill="#edc4c4" font-size="14">状态改变必须通过 feitu_game 工具。</text>
    <g fill="#12283b" stroke="#31526a"><rect x="374" y="670" width="310" height="48" rx="8"/><rect x="700" y="670" width="326" height="48" rx="8"/><rect x="374" y="735" width="310" height="48" rx="8"/><rect x="700" y="735" width="326" height="48" rx="8"/></g>
