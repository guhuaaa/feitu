    <g fill="#122b40" stroke="#345169"><rect x="72" y="275" width="118" height="54" rx="8"/><text x="82" y="294" fill="#e5f4f8">L002</text><text x="82" y="312" fill="#b9d9e8">尸体清理区</text></g>
    <g fill="#122b40" stroke="#345169"><rect x="72" y="362" width="118" height="54" rx="8"/><text x="82" y="381" fill="#e5f4f8">L003</text><text x="82" y="399" fill="#b9d9e8">下水道深处</text></g>
    <g fill="#122b40" stroke="#345169"><rect x="72" y="449" width="118" height="54" rx="8"/><text x="82" y="468" fill="#e5f4f8">L004</text><text x="82" y="486" fill="#b9d9e8">一号线老站台</text></g>
    <g fill="#122b40" stroke="#345169"><rect x="205" y="449" width="118" height="54" rx="8"/><text x="215" y="468" fill="#e5f4f8">L005</text><text x="215" y="486" fill="#b9d9e8">末班列车车厢</text></g>
    <g fill="#122b40" stroke="#345169"><rect x="205" y="536" width="118" height="54" rx="8"/><text x="215" y="555" fill="#e5f4f8">L006</text><text x="215" y="573" fill="#b9d9e8">三号车厢座位</text></g>
    <g fill="#122b40" stroke="#345169"><rect x="205" y="623" width="118" height="54" rx="8"/><text x="215" y="642" fill="#e5f4f8">L007</text><text x="215" y="660" fill="#b9d9e8">车头司机室</text></g>
    <g fill="#122b40" stroke="#345169"><rect x="205" y="710" width="118" height="54" rx="8"/><text x="215" y="729" fill="#e5f4f8">L008</text><text x="215" y="747" fill="#b9d9e8">列车外侧 / 车顶</text></g></g>
