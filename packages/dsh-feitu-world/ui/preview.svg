<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">废土世界游戏界面预览</title>
  <desc id="desc">DeepSeek Harness 外壳中的消失的一号线末班车三栏游戏界面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162b3d"/><stop offset="1" stop-color="#08111d"/></linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c3a4d"/><stop offset="1" stop-color="#0b1622"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#08111d"/>
  <rect x="24" y="20" width="1392" height="860" rx="18" fill="url(#bg)" stroke="#2b4256"/>
  <text x="56" y="62" fill="#72e5ff" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" letter-spacing="4">DEEPSEEK HARNESS · FEITU WORLD</text>
  <text x="56" y="103" fill="#e5f4f8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" font-weight="700">废土世界 <tspan fill="#8ba5bb" font-size="20">/ 消失的一号线末班车</tspan></text>
  <text x="1330" y="70" text-anchor="end" fill="#8ba5bb" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14">单人副本 · 确定性状态</text>
  <rect x="1260" y="84" width="70" height="28" rx="14" fill="#122b40" stroke="#3f657d"/><text x="1295" y="103" text-anchor="middle" fill="#72e5ff" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12">回合 02</text>
  <rect x="1338" y="84" width="54" height="28" rx="14" fill="#122b40" stroke="#3f657d"/><text x="1365" y="103" text-anchor="middle" fill="#72e5ff" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12">祝宁</text>
