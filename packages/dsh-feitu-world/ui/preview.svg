    <g><rect x="1068" y="132" width="326" height="188" rx="12" fill="#0f2030" stroke="#2b4256"/><text x="1090" y="164" fill="#f4ba67" font-size="15" font-weight="700">角色 · 祝宁</text><text x="1090" y="202" fill="#8ba5bb" font-size="12">立场</text><text x="1190" y="202" fill="#d9edf6" font-size="13">先验证后行动</text><text x="1090" y="234" fill="#8ba5bb" font-size="12">能力</text><text x="1190" y="234" fill="#d9edf6" font-size="13">清理装备 / 净化记录</text><text x="1090" y="266" fill="#8ba5bb" font-size="12">防护</text><text x="1190" y="266" fill="#72e5ff" font-size="13">I001 已装备</text></g>
    <g><rect x="1068" y="338" width="326" height="194" rx="12" fill="#0f2030" stroke="#2b4256"/><text x="1090" y="370" fill="#f4ba67" font-size="15" font-weight="700">线索 · 已确认 0</text><text x="1090" y="416" fill="#8ba5bb" font-size="13">◇ 检查区域后显示冻结线索</text><text x="1090" y="448" fill="#8ba5bb" font-size="13">◇ 模型不得自行补全</text></g>
    <g><rect x="1068" y="550" width="326" height="282" rx="12" fill="#0f2030" stroke="#2b4256"/><text x="1090" y="582" fill="#f4ba67" font-size="15" font-weight="700">背包 · 3 件</text><text x="1090" y="630" fill="#d9edf6" font-size="13">防护服与头盔</text><text x="1340" y="630" text-anchor="end" fill="#72e5ff" font-size="12">I001</text><text x="1090" y="678" fill="#d9edf6" font-size="13">空气枪</text><text x="1340" y="678" text-anchor="end" fill="#72e5ff" font-size="12">I002</text><text x="1090" y="726" fill="#d9edf6" font-size="13">清洁背包</text><text x="1340" y="726" text-anchor="end" fill="#72e5ff" font-size="12">I003</text></g>
  </g>
