<body>
<main class="shell">
  <header><div><div class="eyebrow">DEEPSEEK HARNESS · FEITU WORLD</div><h1>废土世界 <span class="muted">/ 消失的一号线末班车</span></h1></div><div class="meta"><div class="role-picker"><label for="role">角色</label><select id="role"><option value="zhunin">祝宁</option><option value="linenchuan">李念川</option></select><button id="worldView">世界枢纽</button><button id="start">开始副本</button></div><div class="hud-tools" aria-label="快速查看面板"><button id="mapToggle" class="hud-icon" type="button" aria-controls="mapDrawer" aria-expanded="false" title="打开无穷轨道地图">∞<span>地图</span></button><button id="helmetToggle" class="hud-icon" type="button" aria-controls="helmetDrawer" aria-expanded="false" title="打开第一视角头盔面板">◉<span>头盔</span></button></div><div id="metaLine">DSH 玩家验收预览 · 尚未开始</div></div></header>

    <section class="panel narrative"><div class="panel-title">现场叙事 · 玩家视角</div><div id="portraitBar" class="portrait-bar" aria-label="当前角色半身像"><img id="portrait" src="/ui/portrait-zhunin.png" alt="祝宁半身像" /><div><div id="portraitName" class="portrait-name">祝宁</div><div id="portraitStance" class="portrait-stance">选择角色后，半身像会固定在对话框上方。</div></div></div><div id="scene" class="scene" role="region" aria-live="polite" aria-label="现场叙事"><div class="empty">DSH 插件已加载。点击“开始副本”进入确定性状态机。</div></div></section>
    <section id="actionDeck" class="panel action-deck" data-mode="action"><div id="actionDeckTitle" class="panel-title">现场输入 · 选择行动或与角色对话</div><div class="action-mode-bar"><div class="action-mode-switch" role="group" aria-label="输入方式"><button id="actionModeChoice" type="button" aria-pressed="true">选择行动</button><button id="dialogueModeChoice" type="button" aria-pressed="false">与角色对话</button></div><label id="dialogueTargetWrap" class="dialogue-target" for="dialogueTarget" hidden>对话对象<select id="dialogueTarget" aria-label="选择对话角色"></select></label></div><div id="choices" class="choices" role="group" aria-label="可选行动"></div><form id="freeActionForm" class="free-action"><label id="freeActionLabel" for="freeAction">自由行动 · 以祝宁身份行动</label><textarea id="freeAction" maxlength="280" rows="2" placeholder="例如：我先检查车厢连接处，确认鱼头人是否在每站上车"></textarea><div id="inputError" class="input-error" role="alert" hidden></div><div class="free-action-footer"><small id="freeActionHint">DeepSeek 将推进剧情，并通过运行时改变可见头盔读数。</small><button id="freeActionSubmit" type="submit">执行行动</button></div></form></section>
    <aside class="stack"><section class="panel"><div class="panel-title">角色状态</div><div id="rolePanel" class="panel-body empty">未选择角色</div></section><section class="panel"><div class="panel-title">已确认线索</div><div id="clues" class="panel-body list"><div class="muted">检查地点后显示冻结线索</div></div></section><section class="panel"><div class="panel-title">背包</div><div id="inventory" class="panel-body list"></div></section><section class="panel"><div class="panel-title">事实台账</div><div id="facts" class="panel-body facts"></div></section></aside>
  </section>

</main>
<style>
  .opening-recap{margin:20px 0;border-top:1px solid #6c8ca344;padding-top:16px}
  .opening-recap summary{cursor:pointer;color:var(--amber);font-size:16px;font-weight:650}
  .opening-excerpt{margin:0}
  .scene .opening-source{font-size:12px;color:var(--muted);margin:10px 0}
</style>
<script>
  const $ = (id) => document.getElementById(id);
  const roleMeta = {
    zhunin: { name: '祝宁', portrait: '/ui/portrait-zhunin.png', stance: '谨慎、先验证后行动；留意李念川的身体状况，保持同行。' },
    linenchuan: { name: '李念川', portrait: '/ui/portrait-linianchuan.png', stance: '年轻、反应快，容易把污染不适误判为闷热；倾向先跟随现场判断。' },
  };
  let selectedDungeonId = 'one-line-last-train';
  let latestView = null;
  let inputMode = 'action';
  function appendOpening(scene, opening, expanded) {
    if (!opening) return;

    const title = document.createElement('summary'); title.textContent = opening.title; recap.appendChild(title);
    if (opening.source) { const source = document.createElement('p'); source.className = 'opening-source'; source.textContent = `《${opening.source.title}》 · ${opening.source.chapter}`; recap.appendChild(source); }
    const excerpt = document.createElement(opening.source ? 'blockquote' : 'div'); excerpt.className = 'opening-excerpt';

    scene.appendChild(recap);
  }
  function updateDialogueTargets(roleId) {
    const select = $('dialogueTarget');
    const previous = select.value;
    const fallback = roleId === 'linenchuan'
      ? [{ id: 'zhunin', name: '祝宁' }, { id: 'xumeng', name: '徐萌' }]
      : [{ id: 'linenchuan', name: '李念川' }, { id: 'xumeng', name: '徐萌' }];
    const targets = latestView?.dialogueTargets?.length ? latestView.dialogueTargets : fallback;
    select.replaceChildren();
    targets.forEach((target) => { const option = document.createElement('option'); option.value = target.id; option.textContent = target.name; select.appendChild(option); });
    if ([...select.options].some((option) => option.value === previous)) select.value = previous;
  }
  function setInputMode(mode) {

    $('dialogueModeChoice').setAttribute('aria-pressed', String(dialogue));

    $('choices').hidden = dialogue;
    const role = latestView?.role || roleMeta[$('role').value] || roleMeta.zhunin;
    if (dialogue) {
      updateDialogueTargets(role.id || $('role').value);
      const targetName = $('dialogueTarget').selectedOptions[0]?.textContent || '角色';
      $('freeActionLabel').textContent = `以${role.name}身份询问${targetName}`;
      $('freeAction').placeholder = '例如：你现在感觉怎么样';
      $('freeActionHint').textContent = `${targetName}会依据当前剧情和人物设定回复，不会替你行动。`;
      $('freeActionSubmit').textContent = '发送对话';
    } else {
      $('freeActionLabel').textContent = `自由行动 · 以${role.name}身份行动`;
      $('freeAction').placeholder = '例如：我留在同伴身旁，查看他的状态';
      $('freeActionHint').textContent = latestView?.dsh?.message || '选择与输入都会走同一事件导演与状态写入链路。';
      $('freeActionSubmit').textContent = '执行行动';
    }
    const ended = Boolean(latestView?.ending);
    for (const id of ['freeAction', 'freeActionSubmit', 'dialogueTarget']) $(id).disabled = ended;

  }
  function clearInputError() { const error = $('inputError'); error.hidden = true; error.textContent = ''; }
  async function call(action) {
    clearInputError();
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20_000);
    try {
      const response = await fetch('/api/game', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(action), signal: controller.signal });
      const data = await response.json();
      if (!response.ok || data.error) throw new Error(data.error || '请求失败');
      render(data);
      return data;
    } catch (error) {
      if (error?.name === 'AbortError') throw new Error('请求超过 20 秒仍未返回，请检查在线模型连接后重试。');

    } finally { clearTimeout(timeout); }
  }
  async function refresh() { const response = await fetch('/api/game'); render(await response.json()); }
  function button(label, action) { const el = document.createElement('button'); el.type = 'button'; el.textContent = label; el.onclick = () => call(action).catch(showError); return el; }
  function actionId() { return globalThis.crypto?.randomUUID?.() || `browser-${Date.now()}-${Math.random().toString(36).slice(2)}`; }
  function isNarrativeAction(action) { return ['move', 'inspect', 'talk', 'take', 'use', 'submit_choice', 'resolve_interactive_event'].includes(action); }
  function assertGameplayOpen() { if (latestView?.ending) throw new Error('本局已结束，请开始新局或恢复检查点。'); }
  async function submitNarrativeAction(action, label) {
    assertGameplayOpen();
    $('freeActionSubmit').disabled = true;
    $('freeActionHint').textContent = '正在通过 DeepSeek Harness 生成后续剧情并校验现场因果…';
    try {
      return await call({ action: 'free_action', action_text: label, selected_action: action, client_action_id: actionId(), expected_turn: latestView?.turn, run_id: latestView?.run_id });
    } finally {
      $('freeActionSubmit').disabled = false;
      setInputMode(inputMode);
    }
  }
  async function submitCharacterDialogue(text) {
    assertGameplayOpen();
    $('freeActionSubmit').disabled = true;
    const targetName = $('dialogueTarget').selectedOptions[0]?.textContent || '角色';
    $('freeActionHint').textContent = `正在连接${targetName}并校验人物设定…`;
    try {
      return await call({ action: 'character_dialogue', dialogue_text: text, target_id: $('dialogueTarget').value, client_action_id: actionId(), expected_turn: latestView?.turn, run_id: latestView?.run_id });
    } finally {
      $('freeActionSubmit').disabled = false;
      setInputMode(inputMode);
    }
  }
  function actionButton(item) {
    if (!isNarrativeAction(item.action)) return button(item.label, item);
    const el = document.createElement('button');
    el.type = 'button'; el.textContent = item.label;
    el.disabled = Boolean(latestView?.ending);
    el.onclick = () => submitNarrativeAction(item, item.label).catch(showError);
    return el;
  }
  function row(label, value, chip = false) { const el = document.createElement('div'); el.className = 'row'; const left = document.createElement('span'); left.className = 'muted'; left.textContent = label; const right = document.createElement('span'); if (chip) right.className = 'chip'; right.textContent = value; el.append(left, right); return el; }
  function showError(error) {
    $('freeActionSubmit').disabled = false;
    setInputMode(inputMode);
    const message = error?.message || '请求失败';
    $('notice').hidden = false; $('notice').setAttribute('role', 'alert'); $('notice').textContent = '工具拒绝了这次行动：' + message;
    const inputError = $('inputError'); inputError.hidden = false; inputError.textContent = `${inputMode === 'dialogue' ? '对话发送失败' : '行动提交失败'}：${message}`;
  }
  function updateRolePreview(roleId) {
    const role = roleMeta[roleId] || roleMeta.zhunin;
    $('portrait').src = role.portrait; $('portrait').alt = `${role.name}半身像`; $('portraitName').textContent = role.name; $('portraitStance').textContent = role.stance;
  }
  function setDrawer(id, open) {
    const drawer = $(id); if (!drawer) return; drawer.hidden = !open;
    const toggle = id === 'mapDrawer' ? $('mapToggle') : $('helmetToggle'); if (toggle) toggle.setAttribute('aria-expanded', String(open));
    if (open) drawer.querySelector('.drawer-close')?.focus();
  }
  function toggleDrawer(id) { setDrawer(id, $(id).hidden); }
  function meter(label, value, max, suffix = '') {
    const el = document.createElement('div'); el.className = 'readout'; const name = document.createElement('div'); name.className = 'readout-label'; name.textContent = label; const amount = document.createElement('div'); amount.className = 'readout-value'; amount.textContent = `${value}${suffix}`; const track = document.createElement('div'); track.className = 'meter'; const fill = document.createElement('span'); fill.style.width = `${Math.max(0, Math.min(100, (Number(value) / Number(max)) * 100))}%`; track.appendChild(fill); el.append(name, amount, track); return el;
  }
  function render(view) {
    latestView = view;
    if (!view || view.started === false) {
      $('metaLine').textContent = 'DSH 玩家验收预览 · 尚未开始';
      $('scene').replaceChildren();
      appendOpening($('scene'), view?.opening, true);
      $('choices').innerHTML = '';
      (view?.saves || []).forEach(runId => $('choices').appendChild(button(`恢复存档：${runId}`, {action:'resume', run_id:runId})));
      updateRolePreview($('role').value);
      updateDialogueTargets($('role').value);
      setInputMode(inputMode);
      return;
    }
    $('notice').hidden = !view.notice; $('notice').removeAttribute('role'); $('notice').textContent = view.notice || '';
    $('role').value = view.role.id;
    updateRolePreview(view.role.id);
    updateDialogueTargets(view.role.id);
    setInputMode(inputMode);
    const metaLine = $('metaLine'); metaLine.textContent = `回合 ${view.turn} · ${view.role.name} · `; const nodeChip = document.createElement('span'); nodeChip.className = 'chip'; nodeChip.textContent = view.currentNode.id; metaLine.append(nodeChip, ` · run ${view.run_id}`);
    const map = $('map'); map.replaceChildren(); const legend = document.createElement('div'); legend.className = 'map-legend'; legend.textContent = '蓝色：当前位置　绿色：已调查　列车首尾相接，永不抵达终点'; map.appendChild(legend);
    view.map.forEach(location => { const point = location.point || {x:50,y:50}; const node = document.createElement('button'); node.type = 'button'; node.disabled = Boolean(view.ending); node.className = `map-node ${location.current ? 'active' : ''} ${location.discovered ? 'discovered' : ''}`; node.style.left = `${point.x}%`; node.style.top = `${point.y}%`; node.setAttribute('aria-label', `${location.id} ${location.name}${location.current ? '，当前位置' : ''}`); if (location.current) node.setAttribute('aria-current', 'location'); node.textContent = location.id; const small = document.createElement('small'); small.textContent = location.name; node.appendChild(small); node.onclick = () => location.current ? submitNarrativeAction({ action: 'inspect', target: location.id }, '检查当前区域').catch(showError) : showError(new Error('请从当前地点沿已知出口行动；列车循环但不会瞬移')); map.appendChild(node); });
    const location = view.location; const scene = $('scene'); scene.replaceChildren();
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = `${location.id} · 剧情节点 ${view.currentNode.id}`;
    const heading = document.createElement('h2'); heading.textContent = location.name;
    const paragraph = document.createElement('p');
    const freeEvent = view.freeActionEvent;
    const locationDescription = {
      L001: '下行绳索悬在井口，地面的照明沿井壁落下。',
      L002: '头灯照亮地下作业区，来路在身后延伸。',
      L003: '潮湿的通道边留着一处落脚的位置。头灯照着近处的墙面，更深处传来水声。',
    };
    paragraph.textContent = locationDescription[location.id] || '当前区域信息已登记。请通过检查、移动或自由行动推进现场。';
    scene.append(tag, heading, paragraph);
    appendOpening(scene, view.opening, view.turn === 0);
    if (freeEvent?.source === 'deepseek' && freeEvent.status !== 'REJECTED') {
      const unlock = document.createElement('article'); unlock.className = 'story-unlock'; unlock.id = `story-unlock-${freeEvent.id}`; unlock.setAttribute('aria-label', '剧情已解锁');
      const eyebrow = document.createElement('div'); eyebrow.className = 'story-unlock-eyebrow'; eyebrow.textContent = freeEvent.unlockLabel || `第${freeEvent.turn ?? view.turn}回合 · 新剧情`;
      const header = document.createElement('div'); header.className = 'story-unlock-header';
      const title = document.createElement('h3'); title.textContent = freeEvent.title;
      const source = document.createElement('span'); source.className = 'story-source'; source.textContent = '在线事件导演';
      header.append(title, source);
      const actor = document.createElement('div'); actor.className = 'story-actor'; actor.textContent = `以${freeEvent.actor?.name || view.role.name}的行动推进 · ${freeEvent.accepted ? '已提交' : '行动受阻'}`;
      const body = document.createElement('div'); body.className = 'story-segment'; body.setAttribute('aria-live', 'polite');
      String(freeEvent.storySegment || freeEvent.text || '').split(/\n{2,}/).filter(Boolean).forEach((part) => { const paragraph = document.createElement('p'); paragraph.textContent = part; body.appendChild(paragraph); });
      const audit = document.createElement('details'); audit.className = 'runtime-audit'; const summary = document.createElement('summary'); summary.textContent = '运行时判定与头盔回执'; audit.appendChild(summary);
      const systemLines = freeEvent.systemLines || [{ kind: freeEvent.accepted ? 'change' : 'warn', label: '事态变化', text: freeEvent.text }];
      systemLines.forEach((item) => { const line = document.createElement('div'); line.className = 'system-line'; line.dataset.kind = item.kind || 'change'; const label = document.createElement('span'); label.className = 'system-line-label'; label.textContent = item.label; const text = document.createElement('span'); text.className = 'system-line-text'; text.textContent = item.text; line.append(label, text); audit.appendChild(line); });
      unlock.append(eyebrow, header, actor, body, audit); scene.appendChild(unlock);
      if (freeEvent.turn === view.turn) requestAnimationFrame(() => unlock.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' }));
    }
    const dialogue = view.visibleDialogue?.at(-1); if (dialogue) {
      const box = document.createElement('article'); box.className = dialogue.userText ? 'dialogue dialogue-exchange' : 'dialogue';
      if (dialogue.userText) {
        const userLine = document.createElement('p'); userLine.className = 'dialogue-line user'; const userName = document.createElement('span'); userName.className = 'dialogue-speaker'; userName.textContent = `${dialogue.actorName || view.role.name} → ${dialogue.speaker}`; userLine.append(userName, document.createTextNode(dialogue.userText));
        const replyLine = document.createElement('p'); replyLine.className = 'dialogue-line reply'; const speaker = document.createElement('span'); speaker.className = 'dialogue-speaker'; speaker.textContent = dialogue.speaker; const source = document.createElement('span'); source.className = 'dialogue-source'; source.textContent = dialogue.source === 'deepseek' ? ' · 角色模型回复' : ' · 本地角色规则回复'; speaker.appendChild(source); replyLine.append(speaker, document.createTextNode(dialogue.text)); box.append(userLine, replyLine);
      } else box.textContent = `${dialogue.speaker}：${dialogue.text}`;
      scene.appendChild(box);
      if (dialogue.userText && dialogue.turn === view.turn) requestAnimationFrame(() => box.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' }));
    }
    if (view.ending) { const end = document.createElement('div'); end.className = 'ending'; end.textContent = `已提交终局：${view.ending.id}`; scene.appendChild(end); }
    const choices = $('choices'); choices.innerHTML = ''; view.choices.forEach(item => choices.appendChild(actionButton({ action: item.action, target: item.target, target_id: item.target_id, item_id: item.item_id, choice_id: item.choice_id, event_id: item.event_id, result_id: item.result_id, label: item.label }))); if (!view.choices.length) choices.appendChild(document.createElement('span')).textContent = view.ending ? '本局已结束。可以保存、恢复检查点，或开始新局。' : '当前节点没有可见选择；可用自由行动继续探索';
    const rolePanel = $('rolePanel'); rolePanel.replaceChildren(row('立场', view.role.stance), row('能力', view.role.abilities.join(' / ')), row('标记', view.flags.coreExposed ? '核心已定位' : view.discoveredClues.length ? '现场情况待核实' : '休息中', true)); rolePanel.classList.remove('empty');
    const pressure = view.pressure || {value: 0, max: 100, phase: 'UNKNOWN', countdown: 0, communication: 'UNKNOWN'}; const helmet = view.helmet || {pollution: {value: pressure.value, max: pressure.max, band: pressure.phase, trend:'待采样'}, communication: {status: pressure.communication, signal:0, latencyMs:null}, oxygen:{value:0}, suitIntegrity:{value:0}, temperature:{value:0}, countdown:pressure.countdown};

    const hudCard = (title, className = '') => { const card = document.createElement('section'); card.className = `hud-card ${className}`; const heading = document.createElement('h3'); heading.textContent = title; card.appendChild(heading); return card; };
    const hudMetric = (label, value, max = 100, suffix = '') => { const block = document.createElement('div'); block.className = 'hud-metric'; const line = document.createElement('div'); const name = document.createElement('span'); name.textContent = label; const amount = document.createElement('strong'); amount.textContent = `${value}${suffix}`; line.append(name, amount); const track = document.createElement('i'); const fill = document.createElement('b'); fill.style.width = `${Math.max(0, Math.min(100, Number(value) / Number(max) * 100))}%`; track.appendChild(fill); block.append(line, track); return block; };
    const viewport = document.createElement('div'); viewport.className = 'hud-viewport'; const image = document.createElement('img'); image.src = '/ui/helmet-industrial-visage-v2.png'; image.alt = `${view.role.name}透过头盔观察${view.location.name}`; image.loading = 'lazy'; viewport.appendChild(image);
    const ident = document.createElement('div'); ident.className = 'hud-ident'; ident.innerHTML = '清洁队头盔系统 v4.2.1<span>103区清洁中心 · LIVE VISOR</span>'; viewport.appendChild(ident);
    const compass = document.createElement('div'); compass.className = 'hud-compass'; compass.textContent = `N  ─────  ${view.location.id}  ─────  E`;
    const mission = document.createElement('div'); mission.className = 'hud-mission'; mission.append(document.createTextNode('当前状况'), document.createElement('strong')); mission.querySelector('strong').textContent = helmet.mission?.title || view.location.name; const missionProgress = document.createElement('small'); missionProgress.textContent = `证据确认进度 ${helmet.mission?.progress ?? 0}%`; mission.appendChild(missionProgress); viewport.append(compass, mission);
    const left = document.createElement('div'); left.className = 'hud-column hud-left';
    const vitals = hudCard('生理状态'); const physical = helmet.physiology || {}; vitals.append(hudMetric('心率', physical.heartRate ?? 0, 160, ' BPM'), hudMetric('精神值', physical.mental ?? 0, 100, ' /100'), hudMetric('体力', physical.stamina ?? 0, 100, ' /100')); const condition = document.createElement('p'); condition.className = `hud-condition ${physical.health === '危险' ? 'danger' : physical.health === '警告' || physical.health === '轻度不适' ? 'warn' : ''}`; condition.textContent = `健康状态：${physical.health || '待采样'} · ${physical.injury || 'NONE'}`; vitals.appendChild(condition);
    const region = hudCard('区域地图 · 当前可见路线', 'hud-region'); const mapSurface = document.createElement('div'); mapSurface.className = 'hud-map-surface'; const mapImage = document.createElement('img'); mapImage.src = '/ui/dungeon-map-infinity.png'; mapImage.alt = ''; const marker = document.createElement('span'); marker.className = 'hud-map-marker'; marker.style.setProperty('--x', `${view.map.find(point => point.current)?.point?.x ?? 50}%`); marker.style.setProperty('--y', `${view.map.find(point => point.current)?.point?.y ?? 50}%`); const mapCaption = document.createElement('span'); mapCaption.className = 'hud-map-caption'; mapCaption.textContent = `${view.location.id} · 当前定位`; mapSurface.append(mapImage, marker, mapCaption); const route = document.createElement('div'); route.className = 'hud-route'; (view.map || []).filter((point) => point.current || point.discovered || point.id === view.location.id).slice(-6).forEach((point) => { const node = document.createElement('span'); node.className = point.current ? 'active' : ''; node.textContent = point.id; route.appendChild(node); }); if (!route.children.length) route.textContent = view.location.id; const locationName = document.createElement('p'); locationName.textContent = view.location.name; region.append(mapSurface, route, locationName);
    const environment = hudCard('环境警告', 'hud-warning'); [['空气污染指数', helmet.environment?.airIndex], ['辐射指数', helmet.environment?.radiation], ['温度', `${helmet.temperature.value}${helmet.temperature.unit}`], ['湿度', `${helmet.environment?.humidity ?? '—'}%`]].forEach(([label, value]) => environment.appendChild(row(label, String(value)))); const warning = document.createElement('p'); warning.textContent = helmet.environment?.warning || '环境读数待采样'; environment.appendChild(warning); left.append(vitals, region, environment);
    const right = document.createElement('div'); right.className = 'hud-column hud-right';
    const equipment = hudCard('装备状态'); [['清理工具', helmet.equipment?.tool || '未切换工具'], ['防护服', `${helmet.equipment?.suitStatus || '完好'} · ${helmet.suitIntegrity.value}%`], ['过滤面罩', `${helmet.equipment?.filterStatus || 'II级过滤'} · ${helmet.equipment?.filterDurability ?? '—'}%`], ['通讯器', `${helmet.equipment?.communicatorStatus || helmet.communication.status} · ${helmet.communication.signal}%`]].forEach(([label, value]) => equipment.appendChild(row(label, value)));
    const bag = hudCard(`背包状态 · ${view.inventory.length}/20`); view.inventory.forEach((item) => bag.appendChild(row(item.name, item.id, true))); if (!view.inventory.length) bag.appendChild(row('无已登记物品', '—'));
    const comms = hudCard(`通讯频道 · ${helmet.communication.channel}`); const signal = document.createElement('p'); signal.className = 'hud-comms'; signal.textContent = `${helmet.communication.status} · 信号 ${helmet.communication.signal}%`; comms.appendChild(signal); const latestDialogue = view.visibleDialogue?.at(-1); const message = document.createElement('p'); message.textContent = latestDialogue ? `${latestDialogue.speaker}：${latestDialogue.text}` : '频道静默，等待现场指令。'; comms.appendChild(message); right.append(equipment, bag, comms);
    const bottom = document.createElement('div'); bottom.className = 'hud-bottom'; const lighting = hudCard('照明模式', 'hud-compact'); lighting.appendChild(row('模式', helmet.pollution.value >= 55 ? '低光夜视' : '强光扫描')); const speed = document.createElement('div'); speed.className = 'hud-speed'; speed.innerHTML = '<span>设备电量</span><strong></strong><small>污染压力</small>'; speed.querySelector('strong').textContent = `${Math.max(18, helmet.suitIntegrity.value - Math.floor(view.turn / 2))}%`; const filter = hudCard('过滤系统', 'hud-compact'); filter.appendChild(row('运行状态', helmet.oxygen.status === 'LOW' ? '负载升高' : '运行中')); filter.appendChild(row('氧气', `${helmet.oxygen.value}%`)); bottom.append(lighting, speed, filter);
    hud.append(viewport, left, right, bottom); pressurePanel.appendChild(hud); pressurePanel.classList.remove('empty');
    const clues = $('clues'); clues.replaceChildren(); if (view.discoveredClues.length) view.discoveredClues.forEach(clue => { const item = document.createElement('div'); item.className = 'clue'; item.textContent = clue; clues.appendChild(item); }); else { const empty = document.createElement('div'); empty.className = 'muted'; empty.textContent = '检查地点后显示冻结线索'; clues.appendChild(empty); }
    const inventory = $('inventory'); inventory.replaceChildren(); view.inventory.forEach(item => inventory.appendChild(row(item.name, item.id, true)));
    const facts = $('facts'); facts.replaceChildren(); const ledger = view.factLedger || {verified:view.visibleFacts || [], suspected:[]}; ledger.verified.forEach(fact => { const item = document.createElement('div'); item.textContent = `已确认 · ${fact}`; facts.appendChild(item); }); ledger.suspected.forEach(fact => { const item = document.createElement('div'); item.className = 'muted'; item.textContent = `待验证 · ${fact}`; facts.appendChild(item); });
    const hasAction = (action) => view.choices.some(item => item.action === action);
    if (!hasAction('inspect')) choices.appendChild(actionButton({ label: '检查当前区域', action: 'inspect', target: view.location.id }));
    if (!hasAction('talk')) choices.appendChild(actionButton({ label: '联系徐萌，说明当前情况', action: 'talk', target: 'xumeng' }));
    if (!hasAction('save')) choices.appendChild(button('保存检查点', {action:'save'}));
    if (view.checkpoint?.available) { choices.appendChild(button('恢复检查点', {action:'load'})); choices.appendChild(button('从当前状态分支', {action:'fork'})); }
    (view.location.takeableItems || []).forEach(item => choices.appendChild(actionButton({ label: `记录物品：${item.name}`, action: 'take', item_id: item.id })));
    view.inventory.filter(item => item.id === 'I003' || item.id === 'I004' || item.id === 'I005').forEach(item => choices.appendChild(actionButton({ label: `使用：${item.name}`, action: 'use', item_id: item.id })));
    setInputMode(inputMode);
  }
  $('mapToggle').onclick = () => toggleDrawer('mapDrawer');
  $('helmetToggle').onclick = () => toggleDrawer('helmetDrawer');
  $('actionModeChoice').onclick = () => setInputMode('action');
  $('dialogueModeChoice').onclick = () => setInputMode('dialogue');
  $('dialogueTarget').onchange = () => setInputMode('dialogue');
  document.querySelectorAll('[data-close]').forEach((close) => close.addEventListener('click', () => setDrawer(close.dataset.close, false)));
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { setDrawer('mapDrawer', false); setDrawer('helmetDrawer', false); } });
  $('worldView').onclick = async () => { try { const response = await fetch('/api/game', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action:'world_view'}) }); const world = await response.json(); const playable = world.dungeons.find(item => item.status === 'PLAYABLE'); if (!playable) throw new Error('世界枢纽当前没有可玩的副本'); selectedDungeonId = playable.id; const announced = world.announcedDungeons || []; $('notice').hidden = false; $('notice').textContent = `世界枢纽：${world.world.name} · ${world.regions.map(item => item.name).join('、')} · 已选择副本：${playable.name} · 已登记未开放 ${announced.length} 个`; const catalog = $('worldCatalog'); catalog.innerHTML = ''; const title = document.createElement('div'); title.className = 'catalog-title'; title.textContent = `来源登记目录 · ${announced.length} 个未开放副本`; catalog.appendChild(title); const grid = document.createElement('div'); grid.className = 'catalog-grid'; announced.forEach(item => { const row = document.createElement('div'); row.className = 'catalog-item'; row.textContent = `${item.chapterRange || '章节待定'} · `; const name = document.createElement('span'); name.textContent = `${item.name} · ${item.taskType || '类型待定'}`; row.appendChild(name); grid.appendChild(row); }); catalog.appendChild(grid); catalog.hidden = false; } catch (error) { showError(error); } };
  $('role').onchange = () => {
    const roleId = $('role').value;
    if (latestView?.started !== false && latestView?.run_id) call({ action: 'switch_role', role_id: roleId, run_id: latestView.run_id, expected_turn: latestView.turn }).catch(showError);
    else { updateRolePreview(roleId); updateDialogueTargets(roleId); setInputMode(inputMode); }
  };
  $('freeActionForm').onsubmit = async (event) => { event.preventDefault(); const input = $('freeAction'); const text = input.value.trim(); if (!text) { showError(new Error(inputMode === 'dialogue' ? '请先输入对话内容。' : '请先描述自由行动。')); return; } try { if (inputMode === 'dialogue') await submitCharacterDialogue(text); else await submitNarrativeAction(null, text); input.value = ''; } catch (error) { showError(error); } };
  $('start').onclick = () => call({action:'start', role_id: $('role').value, dungeon_id: selectedDungeonId}).catch(showError); refresh().catch(() => {});
  if (new URLSearchParams(location.search).get('panel') === 'helmet') setDrawer('helmetDrawer', true);
  updateRolePreview($('role').value);
  updateDialogueTargets($('role').value);
  setInputMode('action');
