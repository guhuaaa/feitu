<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#08111d"/><text x="70" y="82" fill="#72e5ff" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700">关键线索简图 · 一号线末班车</text><text x="70" y="120" fill="#8ba5bb" font-family="Microsoft YaHei,sans-serif" font-size="17">线索卡片只展示已冻结实体；叙事模型不能自行新增因果</text>
  <g font-family="Microsoft YaHei,sans-serif"><g><rect x="70" y="170" width="440" height="190" rx="14" fill="#122b40" stroke="#72e5ff" stroke-width="2"/><text x="100" y="215" fill="#f4ba67" font-size="22">C01 · 评级错误</text><text x="100" y="260" fill="#d9edf6" font-size="17">任务被按 E 级处理，猎魔人已离场。</text><text x="100" y="306" fill="#8ba5bb" font-size="15">触发地点：L001 / L010</text></g><g><rect x="580" y="170" width="440" height="190" rx="14" fill="#122b40" stroke="#72e5ff" stroke-width="2"/><text x="610" y="215" fill="#f4ba67" font-size="22">C02 · 23:35 一号线</text><text x="610" y="260" fill="#d9edf6" font-size="17">老旧站台出现不应存在的末班列车。</text><text x="610" y="306" fill="#8ba5bb" font-size="15">触发地点：L004</text></g><g><rect x="1090" y="170" width="440" height="190" rx="14" fill="#122b40" stroke="#72e5ff" stroke-width="2"/><text x="1120" y="215" fill="#f4ba67" font-size="22">C03 · 同伤复制体</text><text x="1120" y="260" fill="#d9edf6" font-size="17">乘客的伤势与现场损伤出现对应关系。</text><text x="1120" y="306" fill="#8ba5bb" font-size="15">触发地点：L005</text></g><g><rect x="70" y="420" width="440" height="190" rx="14" fill="#122b40" stroke="#72e5ff" stroke-width="2"/><text x="100" y="465" fill="#f4ba67" font-size="22">C04 · 古旧手机</text><text x="100" y="510" fill="#d9edf6" font-size="17">手机年代与无限嵌套当前动作矛盾。</text><text x="100" y="556" fill="#8ba5bb" font-size="15">触发地点：L006</text></g><g><rect x="580" y="420" width="440" height="190" rx="14" fill="#122b40" stroke="#72e5ff" stroke-width="2"/><text x="610" y="465" fill="#f4ba67" font-size="22">C05 · 司机异常</text><text x="610" y="510" fill="#d9edf6" font-size="17">司机并非正常人，核心在列车外侧。</text><text x="610" y="556" fill="#8ba5bb" font-size="15">触发地点：L007 / L008</text></g><g><rect x="1090" y="420" width="440" height="190" rx="14" fill="#122b40" stroke="#72e5ff" stroke-width="2"/><text x="1120" y="465" fill="#f4ba67" font-size="22">C06 · 列车循环</text><text x="1120" y="510" fill="#d9edf6" font-size="17">核心未死时无孢；核心死亡后析出孢子。</text><text x="1120" y="556" fill="#8ba5bb" font-size="15">触发地点：L009</text></g><rect x="70" y="720" width="1460" height="120" rx="14" fill="#2b1c23" stroke="#d76565" stroke-width="2"/><text x="105" y="770" fill="#edc4c4" font-size="18">验收规则：每条线索必须来自地点检查、冻结物品或 NPC 事实；任何超出状态机的数据均视为失败。</text><text x="105" y="808" fill="#edc4c4" font-size="15">PVA-004 / PVA-007 / PVA-012 对应自动化玩家视角验收。</text></g>
</svg>
