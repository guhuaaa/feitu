name: Desktop release candidate

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create a private draft GitHub prerelease after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - name: Install locked desktop dependencies
        working-directory: desktop/electron
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify clean-checkout release tooling
        working-directory: desktop/electron
        run: |
          npm.cmd run test:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify Steam candidate
        working-directory: desktop/electron
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          FEITU_REQUIRE_CODE_SIGNING: ${{ secrets.WINDOWS_CSC_LINK != '' && '1' || '0' }}
        run: |
          npm.cmd run release:steam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run release:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run release:smoke -- --channel steam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify GitHub portable archive
        working-directory: desktop/electron
        run: |
          npm.cmd run release:github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run release:github:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run release:smoke -- --channel github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read desktop version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/electron/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: FeituWorld-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/artifacts/FeituWorld-${{ steps.version.outputs.version }}-windows-x64.zip
            release/artifacts/FeituWorld-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            release/artifacts/FeituWorld-${{ steps.version.outputs.version }}-windows-x64-github.json
          if-no-files-found: error
      - name: Create draft prerelease
        if: inputs.create_draft_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $null = git ls-remote --exit-code --tags origin "refs/tags/v$version" "refs/tags/v$version^{}"
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -eq 0) { throw "Tag v$version already exists. Use a new version; existing release tags must not be moved." }
          if ($tagLookupExitCode -ne 2) { exit $tagLookupExitCode }
          gh release create "v$version" `
            "release/artifacts/FeituWorld-$version-windows-x64.zip" `
            "release/artifacts/FeituWorld-$version-windows-x64.zip.sha256" `
            "release/artifacts/FeituWorld-$version-windows-x64-github.json" `
            --draft --prerelease --generate-notes --target "$env:GITHUB_SHA" --title "废土末班车 v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
